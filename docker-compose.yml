# DJ AI OS — Local Development Stack
# Usage: docker-compose up --build

version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: dj_ai_os_db
    environment:
      POSTGRES_DB: dj_ai_os
      POSTGRES_USER: dj_ai
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dj_ai -d dj_ai_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dj_ai_os_api
    command: uvicorn app.server.run:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DJ_AI_OS_DATABASE_URL: postgresql+asyncpg://dj_ai:devpass@db:5432/dj_ai_os
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_key}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_your_secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-your_admin_token_here}
      DJ_AI_OS_API_RELOAD: "true"
      DJ_AI_OS_INIT_DB: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app  # For reload

volumes:
  pgdata: