# ============================================================
# ORB Manifest — DJ AI OS Module Declaration
# ============================================================
# Defines the complete module graph: dependencies, capabilities,
# entry points, and load order for the ORB kernel.
#
# Modules load in dependency order (topological sort) then
# start in the same order. Stop/unload happens in reverse.
# ============================================================

orb_version: "1.0"

runtime:
  name: "DJ AI OS — ORB Runtime"
  version: "0.1.0"
  min_python: "3.10"
  platforms: ["win32", "linux", "darwin"]
  log_level: "INFO"
  data_dir: "./data"

modules:

  # --------------------------------------------------------
  # CORE — Always loaded first
  # --------------------------------------------------------
  orb_core:
    name: "orb_core"
    version: "0.1.0"
    type: core
    description: "ORB kernel itself — event bus, registry, health"
    entry_point: "orb_core.kernel_module:KernelModule"
    priority: 0
    capabilities: [events.publish, events.subscribe, config.read, config.write]
    hot_reload: false

  config:
    name: "config"
    version: "0.1.0"
    type: core
    description: "Centralized config store with schema validation"
    entry_point: "modules.config_module:ConfigModule"
    priority: 10
    capabilities: [config.read, config.write, fs.read]

  platform:
    name: "platform"
    version: "0.1.0"
    type: core
    description: "Cross-platform abstraction (audio/midi/hid/fs/process)"
    entry_point: "modules.platform_module:PlatformModule"
    priority: 10
    capabilities: [process.spawn, config.read]
    dependencies: []

  # --------------------------------------------------------
  # HARDWARE — MIDI / HID controllers
  # --------------------------------------------------------
  midi_engine:
    name: "midi_engine"
    version: "0.1.0"
    type: midi
    description: "MIDI I/O, mapping, and calibration (XDJ-RR support)"
    entry_point: "modules.midi_module:MidiModule"
    priority: 30
    capabilities: [midi.input, midi.output, config.read, config.write]
    dependencies: [config]
    config_defaults:
      auto_discover: true
      default_port: ""

  hid_engine:
    name: "hid_engine"
    version: "0.1.0"
    type: hid
    description: "Pioneer XDJ-RR/RX2 HID protocol engine"
    entry_point: "modules.hid_module:HidModule"
    priority: 30
    capabilities: [hid.input, hid.output, config.read]
    dependencies: [config]

  # --------------------------------------------------------
  # AUDIO — Playback, analysis, instruments
  # --------------------------------------------------------
  audio_engine:
    name: "audio_engine"
    version: "0.1.0"
    type: audio
    description: "Audio playback, stems, quality processing"
    entry_point: "modules.audio_module:AudioModule"
    priority: 40
    capabilities: [audio.playback, audio.record, audio.analysis, config.read]
    dependencies: [config, platform]

  beat_engine:
    name: "beat_engine"
    version: "0.1.0"
    type: audio
    description: "Beatgrid analysis, tempo detection, beat sync"
    entry_point: "modules.beat_module:BeatModule"
    priority: 40
    capabilities: [audio.analysis, events.publish, events.subscribe]
    dependencies: [audio_engine]

  instruments:
    name: "instruments"
    version: "0.1.0"
    type: instrument
    description: "Synth instruments, drums, melodic, serum-style patches"
    entry_point: "modules.instrument_module:InstrumentModule"
    priority: 40
    capabilities: [audio.playback, config.read]
    dependencies: [audio_engine]

  # --------------------------------------------------------
  # CREATIVE — Beat Studio, Deck Studio
  # --------------------------------------------------------
  beat_studio:
    name: "beat_studio"
    version: "0.1.0"
    type: core
    description: "Full DAW — step sequencer, piano roll, arrangement, mixer"
    entry_point: "modules.beat_studio_module:BeatStudioModule"
    priority: 50
    capabilities: [audio.playback, audio.record, config.read, config.write, ui.render]
    dependencies: [audio_engine, instruments]

  deck_studio:
    name: "deck_studio"
    version: "0.1.0"
    type: core
    description: "4-deck virtual DJ — waveforms, library, effects"
    entry_point: "modules.deck_studio_module:DeckStudioModule"
    priority: 50
    capabilities: [audio.playback, midi.input, hid.input, ui.render, config.read]
    dependencies: [audio_engine, midi_engine, hid_engine]

  rekordbox:
    name: "rekordbox"
    version: "0.1.0"
    type: utility
    description: "Rekordbox XML import/export bridge"
    entry_point: "modules.rekordbox_module:RekordboxModule"
    priority: 45
    capabilities: [fs.read, fs.write, config.read]
    dependencies: [config]
    platform: [win32]

  # --------------------------------------------------------
  # AI — Brain, coach, profile
  # --------------------------------------------------------
  ai_brain:
    name: "ai_brain"
    version: "0.1.0"
    type: ai
    description: "DJ Brain — set intelligence, music theory"
    entry_point: "modules.ai_brain_module:AiBrainModule"
    priority: 60
    capabilities: [audio.analysis, events.publish, events.subscribe, config.read]
    dependencies: [audio_engine, beat_engine]

  dj_coach:
    name: "dj_coach"
    version: "0.1.0"
    type: ai
    description: "AI coach — live feedback on transitions, timing"
    entry_point: "modules.dj_coach_module:DjCoachModule"
    priority: 60
    capabilities: [audio.analysis, events.publish, events.subscribe]
    dependencies: [deck_studio, beat_engine]

  dj_profile:
    name: "dj_profile"
    version: "0.1.0"
    type: ai
    description: "DJ Style DNA profile, track similarity, style evolution"
    entry_point: "modules.dj_profile_module:DjProfileModule"
    priority: 60
    capabilities: [config.read, config.write, fs.read]
    dependencies: [config]

  # --------------------------------------------------------
  # CLOUD — Portal, telemetry, updates
  # --------------------------------------------------------
  cloud_sync:
    name: "cloud_sync"
    version: "0.1.0"
    type: cloud
    description: "Portal client, telemetry, update engine"
    entry_point: "modules.cloud_module:CloudModule"
    priority: 70
    capabilities: [net.client, config.read]
    dependencies: [config]
    optional_dependencies: [platform]

  # --------------------------------------------------------
  # UI — Host & theme
  # --------------------------------------------------------
  ui_host:
    name: "ui_host"
    version: "0.1.0"
    type: ui
    description: "CustomTkinter host, neon theme, plugin UI slots"
    entry_point: "modules.ui_host_module:UiHostModule"
    priority: 80
    capabilities: [ui.render, events.publish, events.subscribe, config.read]
    dependencies: [config, deck_studio, beat_studio]
    optional_dependencies: [dj_coach, dj_profile, cloud_sync]
    config_defaults:
      theme: "tron"
      window_width: 1280
      window_height: 800