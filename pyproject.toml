[project]
name = "dj-ai-os"
version = "0.1.0"
description = "DJ AI OS - desktop-first music library assistant for professional DJs"
requires-python = ">=3.10"

# Minimal deps required at import time by test-imported modules.
# Heavy ML/Audio/UI deps (torch, opencv, vosk, yt-dlp, etc.) are loaded
# lazily inside methods via try/except — they are NOT required at import time.
dependencies = [
    "customtkinter",
    "mutagen",
    "cryptography",
    "pygame",
    "librosa",
    "numpy",
    "soundfile",
    "audioread",
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests",
    "beautifulsoup4",
    "mido",
    "pyyaml",
    "sqlalchemy",
    "asyncpg",
    "aiosqlite",
    "alembic",
    "stripe",
    "httpx",
    "psycopg2-binary",
]

[project.optional-dependencies]
server = [
    "httptools",
    "watchfiles",
    "websockets",
    "python-dotenv",
]
dev = [
    "pytest",
]
neural = [
    "torch",
    "torchaudio",
    "opencv-python",
    "vosk",
    "yt-dlp",
    "scipy",
    "edge-tts",
    "pyttsx3",
    "sounddevice",
    "pyaudio",
    "windnd",
    "SpeechRecognition",
    "watchdog",
    "zeroconf",
    "msgpack",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
