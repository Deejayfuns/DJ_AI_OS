[project]
name = "dj-ai-os"
version = "0.1.0"
description = "DJ AI OS - desktop-first music library assistant for professional DJs"
requires-python = ">=3.10"

[project.optional-dependencies]
server = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
    "httptools",
    "watchfiles",
    "websockets",
]
dev = [
    "pytest",
]
neural = [
    "torch",
    "torchaudio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
