name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DJ_AI_OS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dj_ai_os_test
  DJ_AI_OS_INIT_DB: "true"
  LC_ALL: C
  LANG: C

jobs:
  lint-typecheck:
    name: Lint & Typecheck (if configured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Check lint/typecheck config
        run: |
          echo "No mypy/ruff/black/flake8 config in pyproject.toml — skipping."
          echo "If you add linting later, update this job."

  test:
    name: Test Suite (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"
          pip install aiosqlite

      - name: Run full test suite (SQLite)
        run: xvfb-run -a python -m pytest -q --tb=short
        env:
          DJ_AI_OS_DATABASE_URL: sqlite+aiosqlite:///./test.db
          DJ_AI_OS_SKIP_STARTUP_VALIDATION: "1"

  pg-migration:
    name: PostgreSQL Migration Gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dj_ai_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"
          pip install asyncpg

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Verify alembic heads
        run: python tools/ci/verify_alembic_heads.py

      - name: alembic upgrade head
        run: python tools/ci/alembic_upgrade_head.py

      - name: Verify migration created all tables
        run: python tools/ci/verify_migration_tables.py

      - name: Verify schema matches SQLAlchemy models
        run: python tools/ci/verify_schema_matches.py

      - name: alembic downgrade base + re-upgrade (idempotent cycle)
        run: python tools/ci/alembic_downgrade_upgrade_cycle.py

      - name: Server smoke test (TestClient against PostgreSQL)
        run: python tools/ci/server_smoke_test.py
        env:
          DJ_AI_OS_SKIP_STARTUP_VALIDATION: "1"

  pg-migration-test-file:
    name: PostgreSQL Migration Test File
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dj_ai_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"
          pip install asyncpg psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run tests/test_alembic_pg_migration.py
        run: python -m pytest tests/test_alembic_pg_migration.py -v
        env:
          DJ_AI_OS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dj_ai_os_test
          DJ_AI_OS_INIT_DB: "true"
          LC_ALL: C
          LANG: C

  server-e2e:
    name: Server E2E Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dj_ai_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"
          pip install asyncpg psycopg2-binary

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 1
          done

      - name: Run server E2E tests
        run: python -m pytest tests/test_update_e2e_server.py tests/test_update_manifest_endpoint.py -v
        env:
          DJ_AI_OS_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/dj_ai_os_test
          DJ_AI_OS_INIT_DB: "true"
          DJ_AI_OS_SKIP_STARTUP_VALIDATION: "1"
          DJ_AI_OS_UPDATE_MANIFEST: update_manifest_signed.json
          DJ_AI_OS_UPDATE_ARTIFACTS: dist/update_artifacts
          LC_ALL: C
          LANG: C

  build-gate:
    name: Build Gate (Windows only)
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event.pull_request.head.ref == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e ".[dev,server]"
          pip install pyinstaller

      - name: Check build_exe.py syntax
        run: python build_exe.py --clean

      - name: Verify build_exe.py imports (dry run)
        run: python tools/ci/verify_build_exe_imports.py

      - name: Build (onedir mode) — optional, may take 3-5 min
        run: python build_exe.py
        timeout-minutes: 10
        env:
          PIP_CACHE_DIR: ${{ runner.temp }}/pip-cache

      - name: Verify build artifacts
        if: success()
        run: |
          if (Test-Path "dist/DJ_AI_OS/DJ_AI_OS.exe") {
            Write-Host "Build artifact found: dist/DJ_AI_OS/DJ_AI_OS.exe"
            $size = (Get-Item "dist/DJ_AI_OS/DJ_AI_OS.exe").Length
            Write-Host "EXE size: $($size / 1MB) MB"
          } else {
            Write-Host "Build artifact NOT found"
            exit 1
          }

  security-check:
    name: Security — Secret Leakage Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets in current commit diff
        run: |
          patterns=(
            "sk_test_"
            "sk_live_"
            "whsec_"
            "vendor_private_key.pem"
            "ADMIN_TOKEN="
            "DJ_AI_OS_LICENSE_PRIVATE_KEY"
            "BEGIN PRIVATE KEY"
            "BEGIN EC PRIVATE KEY"
          )
          found=0
          # Get the diff for the current commit range
          # For PR: compare PR head vs base; for push: compare new commit vs previous
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            DIFF_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          else
            DIFF_RANGE="HEAD~1..HEAD"
          fi
          for pat in "${patterns[@]}"; do
            # Check only added lines in the current commit diff (^\+), not commit messages
            if git diff "$DIFF_RANGE" 2>/dev/null | grep -E "^\+\s*.*${pat}" | head -1 | grep -q .; then
              echo "PATTERN FOUND IN ADDED DIFF LINES: $pat"
              found=1
            fi
          done
          if [ $found -eq 1 ]; then
            echo "SECRET LEAKAGE DETECTED IN CURRENT COMMIT DIFF (added lines)"
            exit 1
          else
            echo "No secret patterns found in current commit diff (added lines)"
          fi

      - name: Verify .gitignore covers secrets
        run: |
          required=(
            "vendor_private_key.pem"
            "license.key"
            "dev.flag"
            ".env"
          )
          missing=0
          for req in "${required[@]}"; do
            if ! grep -q "^$req\$" .gitignore; then
              echo "MISSING from .gitignore: $req"
              missing=1
            fi
          done
          if [ $missing -eq 1 ]; then
            echo ".gitignore incomplete — secrets may leak"
            exit 1
          else
            echo ".gitignore covers all required secret patterns"
          fi